<title>SJM Perfumes · Pide por WhatsApp</title>
<link href="https://fonts.googleapis.com/css2?family=Michroma&family=Montserrat:wght@400;500;600&family=Cormorant+Garamond:ital,wght@1,500&display=swap" rel="stylesheet">
<style>
:root{--g:#e2be7a;--g2:#f6e3b8;--bg:#0a0806}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(120% 70% at 50% 0%,#2a1f12 0%,var(--bg) 60%);color:#f3eadb;font-family:Montserrat,sans-serif;min-height:100vh}
.w{max-width:520px;margin:0 auto;padding:36px 20px 60px}
.logo{display:block;margin:0 auto 10px;width:110px;border-radius:50%;box-shadow:0 0 40px rgba(226,190,122,.25)}
h1{font-family:Michroma,sans-serif;font-weight:400;text-align:center;letter-spacing:.18em;font-size:20px;margin:6px 0 4px;background:linear-gradient(#fff4d6,#c4964e,#ffecc4);-webkit-background-clip:text;color:transparent}
.sub{text-align:center;font-family:'Cormorant Garamond',serif;font-style:italic;font-size:22px;color:var(--g2);margin:0 0 26px}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:17px;border-radius:14px;border:0;font:600 15px Montserrat;letter-spacing:.08em;text-decoration:none;cursor:pointer}
.main{background:linear-gradient(135deg,#f1d79a,#c39550);color:#1a1209;box-shadow:0 8px 30px rgba(226,190,122,.25)}
.sec{margin-top:30px;font:400 12px Michroma;letter-spacing:.22em;color:var(--g);text-align:center}
.rule{height:1px;background:linear-gradient(90deg,transparent,var(--g),transparent);margin:10px auto 16px;width:70%}
input{width:100%;padding:15px 16px;border-radius:12px;border:1px solid #6b5533;background:#14100b;color:#f3eadb;font:500 15px Montserrat;outline:none}
input:focus{border-color:var(--g)}
.list{display:grid;gap:9px}
.it{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border:1px solid #3a2e1d;border-radius:12px;background:rgba(255,255,255,.02);color:#f3eadb;text-decoration:none;font-size:15px}
.it span{color:var(--g);font-size:12px;letter-spacing:.1em}
.it:active{background:rgba(226,190,122,.12)}
.foot{margin-top:34px;text-align:center;font-size:13px;color:#bfae92;line-height:1.6}
#other{margin-top:10px}
</style></head><body><div class="w">
